name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]" -r requirements-dev.txt
      - run: python -m ruff check src tests
      - run: python -m pytest --cov=sentinelgate --cov-fail-under=80
      - run: python -m sentinelgate.redteam
      - run: python -m sentinelgate.evaluation
      - run: python -m sentinelgate.benchmark_suite --iterations 500 --output evidence/benchmark.json
      - run: python -m bandit -q -r src
      - run: python -m pip_audit -r requirements.txt
