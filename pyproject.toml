[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinelgate"
version = "0.9.0"
description = "Fail-closed security gateway for AI agent tool calls"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=50,<51",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.25,<5",
  "pyjwt[crypto]>=2.10,<3",
  "openai>=1.68,<3",
  "pydantic-settings>=2.7,<3",
  "psutil>=7,<8",
  "psycopg[binary,pool]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "pytest-cov>=7,<8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
ignore = ["B008"]  # FastAPI intentionally constructs Depends in signatures.

[tool.hatch.build]
exclude = [
  "/.venv",
  "/.venv-release",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.coverage",
  "/data",
  "/dist",
  "/release-dist",
  "/release-final",
  "/release-v0.7",
  "/release-v0.7-final",
  "/release-v0.8",
  "/htmlcov",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sentinelgate"]
